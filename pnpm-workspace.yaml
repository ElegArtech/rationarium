packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@prisma/engines": true
  prisma: true

  cpu-features: false
  ssh2: false

  protobufjs: false

  "@scarf/scarf": false

# Correctifs des versions transitives épinglées par NestJS, Swagger et Prisma.
# Décision et contrôles : docs/adr/ADR-20261003-stabilisation.md.
overrides:
  '@nestjs/platform-fastify@11.2.7>fastify': '5.12.8'
  '@nestjs/swagger@11.4.6>js-yaml': '5.4.2'
  '@prisma/config@7.10.0>deepmerge-ts': '8.0.2'
  'prisma@7.10.0>mysql2': '3.24.5'
  # Avis publiés après 1.0.2, corrigés dans la même série (3 novembre 2026).
  'fast-uri@>=3.0.0 <3.1.9': '3.1.9'
  'fast-uri@>=4.0.0 <4.2.3': '4.2.3'
  'ip-address@<10.7.4': '10.7.5'
  'seroval@>=1.5.5 <1.6.11': '1.6.12'
  'seroval-plugins@>=1.6.0 <1.6.11': '1.6.12'
  'undici@>=8.0.0 <8.12.2': '8.12.3'
