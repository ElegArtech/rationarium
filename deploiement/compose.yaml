# Installation depuis les images publiées. Pour construire : compose.construction.yaml.
name: ${NOM_PROJET:-rationarium}

x-base: &base
  PGHOST: base
  PGPORT: '5432'
  PGUSER: ${POSTGRES_UTILISATEUR:-rationarium}
  PGPASSWORD: ${POSTGRES_MOTDEPASSE:?renseigner POSTGRES_MOTDEPASSE dans .env}
  PGDATABASE: ${POSTGRES_BASE:-rationarium}

services:
  base:
    image: postgres:18.6-bookworm
    pull_policy: ${MODE_IMAGES:-missing}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_UTILISATEUR:-rationarium}
      POSTGRES_PASSWORD: ${POSTGRES_MOTDEPASSE:?renseigner POSTGRES_MOTDEPASSE dans .env}
      POSTGRES_DB: ${POSTGRES_BASE:-rationarium}
      TZ: ${RATIONARIUM_FUSEAU:-Europe/Paris}
    volumes:
      - donnees:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [interne]

  migrations:
    image: ${REGISTRE_RATIONARIUM:-ghcr.io/elegartech}/rationarium-api:${VERSION_RATIONARIUM:-1.0.0-rc.1}
    pull_policy: ${MODE_IMAGES:-missing}
    restart: 'no'
    depends_on:
      base:
        condition: service_healthy
    environment: *base
    working_dir: /rationarium/packages/db
    command: ['/rationarium/packages/db/node_modules/.bin/prisma', 'migrate', 'deploy']
    networks: [interne]

  amorcage:
    image: ${REGISTRE_RATIONARIUM:-ghcr.io/elegartech}/rationarium-api:${VERSION_RATIONARIUM:-1.0.0-rc.1}
    pull_policy: ${MODE_IMAGES:-missing}
    restart: 'no'
    depends_on:
      migrations:
        condition: service_completed_successfully
    environment:
      <<: *base
      COOKIE_SECRET: ${COOKIE_SECRET:?renseigner COOKIE_SECRET dans .env}
      RATIONARIUM_ADMIN_LOGIN: ${RATIONARIUM_ADMIN_LOGIN:-admin}
      RATIONARIUM_ADMIN_EMAIL: ${RATIONARIUM_ADMIN_EMAIL:-admin@localhost}
      RATIONARIUM_ADMIN_MOTDEPASSE: ${RATIONARIUM_ADMIN_MOTDEPASSE:-}
    command: ['node', 'dist/exploitation/amorcage.js']
    networks: [interne]

  api:
    image: ${REGISTRE_RATIONARIUM:-ghcr.io/elegartech}/rationarium-api:${VERSION_RATIONARIUM:-1.0.0-rc.1}
    pull_policy: ${MODE_IMAGES:-missing}
    restart: unless-stopped
    depends_on:
      amorcage:
        condition: service_completed_successfully
    environment:
      <<: *base
      COOKIE_SECRET: ${COOKIE_SECRET:?renseigner COOKIE_SECRET dans .env}
      RATIONARIUM_URL_PUBLIQUE: ${RATIONARIUM_URL_PUBLIQUE:-http://localhost:8080}
      RATIONARIUM_HOTE: ${RATIONARIUM_HOTE:-http://localhost}
      RATIONARIUM_DOCUMENTS: /var/lib/rationarium/documents
      RATIONARIUM_FUSEAU: ${RATIONARIUM_FUSEAU:-Europe/Paris}
      RATIONARIUM_CRON_ALERTES: ${RATIONARIUM_CRON_ALERTES:-0 7 * * *}
      SMTP_HOTE: ${SMTP_HOTE:-}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_TLS: ${SMTP_TLS:-false}
      SMTP_UTILISATEUR: ${SMTP_UTILISATEUR:-}
      SMTP_MOTDEPASSE: ${SMTP_MOTDEPASSE:-}
      SMTP_EXPEDITEUR: ${SMTP_EXPEDITEUR:-rationarium@localhost}
    volumes:
      - documents:/var/lib/rationarium/documents
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/sante/pret').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks: [interne]

  web:
    image: ${REGISTRE_RATIONARIUM:-ghcr.io/elegartech}/rationarium-web:${VERSION_RATIONARIUM:-1.0.0-rc.1}
    pull_policy: ${MODE_IMAGES:-missing}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      RATIONARIUM_HOTE: ${RATIONARIUM_HOTE:-http://localhost}
      RATIONARIUM_API: api:3000
      DIRECTIVE_TLS: ${DIRECTIVE_TLS:-}
      DIRECTIVE_COURRIEL_ACME: ${COURRIEL_ACME:+email ${COURRIEL_ACME:-}}
    ports:
      - '${RATIONARIUM_PORT_HTTP:-8080}:80'
      - '${RATIONARIUM_PORT_HTTPS:-8443}:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certificats:/etc/rationarium/certificats:ro
      - caddy:/data
      - caddy_config:/config
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1/_sante']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [interne, acces]

networks:
  interne:
    internal: ${RESEAU_INTERNE:-false}
  acces:

volumes:
  documents:
  donnees:
  caddy:
  caddy_config:
