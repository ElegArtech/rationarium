# Installation depuis les images publiées. Pour construire : compose.construction.yaml.
name: ${NOM_PROJET:-rationarium}

# Propriétaire de la base : migrations, sauvegarde, restauration. Jamais l'application.
x-base: &base
  PGHOST: base
  PGPORT: '5432'
  PGUSER: ${POSTGRES_UTILISATEUR:-rationarium}
  PGPASSWORD: ${POSTGRES_MOTDEPASSE:?renseigner POSTGRES_MOTDEPASSE dans .env}
  PGDATABASE: ${POSTGRES_BASE:-rationarium}

# Rôle de connexion de l'application : ni superutilisateur, ni création de rôle
# ou de base, journal d'audit en ajout seul. Son secret est engendré par le
# service migrations (docs/adr/ADR-20261008-role-applicatif.md).
x-application: &application
  PGHOST: base
  PGPORT: '5432'
  PGUSER: ${POSTGRES_UTILISATEUR_APPLICATION:-rationarium_api}
  PGPASSWORD_FILE: /var/lib/rationarium/identifiants/postgresql
  PGDATABASE: ${POSTGRES_BASE:-rationarium}

x-durcissement: &durcissement
  security_opt: ['no-new-privileges:true']
  cap_drop: [ALL]

services:
  base:
    image: ${REGISTRE_RATIONARIUM:-ghcr.io/elegartech}/rationarium-base:${VERSION_RATIONARIUM:-1.0.2}
    pull_policy: ${MODE_IMAGES:-missing}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_UTILISATEUR:-rationarium}
      POSTGRES_PASSWORD: ${POSTGRES_MOTDEPASSE:?renseigner POSTGRES_MOTDEPASSE dans .env}
      POSTGRES_DB: ${POSTGRES_BASE:-rationarium}
      TZ: ${RATIONARIUM_FUSEAU:-Europe/Paris}
    <<: *durcissement
    # L'entrée de l'image prépare PGDATA en root (chown, find), puis passe à
    # l'utilisateur postgres (su-exec). FOWNER sert son chmod 0700, dont l'échec
    # serait ignoré en silence et ne se verrait qu'au refus de PostgreSQL.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    volumes:
      - donnees:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [interne]

  migrations:
    image: ${REGISTRE_RATIONARIUM:-ghcr.io/elegartech}/rationarium-api:${VERSION_RATIONARIUM:-1.0.2}
    pull_policy: ${MODE_IMAGES:-missing}
    restart: 'no'
    depends_on:
      base:
        condition: service_healthy
    <<: *durcissement
    environment:
      <<: *base
      RATIONARIUM_PG_APPLICATION: ${POSTGRES_UTILISATEUR_APPLICATION:-rationarium_api}
      RATIONARIUM_PG_APPLICATION_SECRET: /var/lib/rationarium/identifiants/postgresql
    working_dir: /rationarium/packages/db
    command: ['sh', '-c', '/rationarium/packages/db/node_modules/.bin/prisma migrate deploy && node /rationarium/apps/api/dist/exploitation/provisionner-role.js']
    volumes:
      - identifiants:/var/lib/rationarium/identifiants
    networks: [interne]

  amorcage:
    image: ${REGISTRE_RATIONARIUM:-ghcr.io/elegartech}/rationarium-api:${VERSION_RATIONARIUM:-1.0.2}
    pull_policy: ${MODE_IMAGES:-missing}
    restart: 'no'
    depends_on:
      migrations:
        condition: service_completed_successfully
    <<: *durcissement
    environment:
      <<: *application
      COOKIE_SECRET: ${COOKIE_SECRET:?renseigner COOKIE_SECRET dans .env}
      RATIONARIUM_ADMIN_LOGIN: ${RATIONARIUM_ADMIN_LOGIN:-}
      RATIONARIUM_ADMIN_EMAIL: ${RATIONARIUM_ADMIN_EMAIL:-admin@localhost}
      RATIONARIUM_ADMIN_MOTDEPASSE: ${RATIONARIUM_ADMIN_MOTDEPASSE:-}
    command: ['node', 'dist/exploitation/amorcage.js']
    volumes:
      - identifiants:/var/lib/rationarium/identifiants:ro
    networks: [interne]

  api:
    image: ${REGISTRE_RATIONARIUM:-ghcr.io/elegartech}/rationarium-api:${VERSION_RATIONARIUM:-1.0.2}
    pull_policy: ${MODE_IMAGES:-missing}
    restart: unless-stopped
    depends_on:
      amorcage:
        condition: service_completed_successfully
    <<: *durcissement
    environment:
      <<: *application
      COOKIE_SECRET: ${COOKIE_SECRET:?renseigner COOKIE_SECRET dans .env}
      RATIONARIUM_URL_PUBLIQUE: ${RATIONARIUM_URL_PUBLIQUE:-http://localhost:8080}
      RATIONARIUM_HOTE: ${RATIONARIUM_HOTE:-http://localhost}
      RATIONARIUM_DOCUMENTS: /var/lib/rationarium/documents
      RATIONARIUM_FUSEAU: ${RATIONARIUM_FUSEAU:-Europe/Paris}
      RATIONARIUM_CRON_ALERTES: ${RATIONARIUM_CRON_ALERTES:-0 7 * * *}
      SMTP_HOTE: ${SMTP_HOTE:-}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_TLS: ${SMTP_TLS:-false}
      SMTP_UTILISATEUR: ${SMTP_UTILISATEUR:-}
      SMTP_MOTDEPASSE: ${SMTP_MOTDEPASSE:-}
      SMTP_EXPEDITEUR: ${SMTP_EXPEDITEUR:-rationarium@localhost}
    volumes:
      - documents:/var/lib/rationarium/documents
      - identifiants:/var/lib/rationarium/identifiants:ro
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/sante/pret').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks: [interne]

  web:
    image: ${REGISTRE_RATIONARIUM:-ghcr.io/elegartech}/rationarium-web:${VERSION_RATIONARIUM:-1.0.2}
    pull_policy: ${MODE_IMAGES:-missing}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      RATIONARIUM_HOTE: ${RATIONARIUM_HOTE:-http://localhost}
      RATIONARIUM_API: api:3000
      DIRECTIVE_TLS: ${DIRECTIVE_TLS:-}
      DIRECTIVE_COURRIEL_ACME: ${COURRIEL_ACME:+email ${COURRIEL_ACME:-}}
    <<: *durcissement
    # Caddy s'exécute en root dans l'image : ports 80/443, et lecture du
    # Caddyfile et des certificats montés quel que soit leur propriétaire.
    cap_add: [NET_BIND_SERVICE, DAC_READ_SEARCH]
    # Vide : toutes les interfaces. 127.0.0.1 pour un accès local en HTTP,
    # l'adresse d'une interface interne pour un réseau privé.
    ports:
      - '${RATIONARIUM_IP_ECOUTE:+${RATIONARIUM_IP_ECOUTE:-}:}${RATIONARIUM_PORT_HTTP:-8080}:80'
      - '${RATIONARIUM_IP_ECOUTE:+${RATIONARIUM_IP_ECOUTE:-}:}${RATIONARIUM_PORT_HTTPS:-8443}:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certificats:/etc/rationarium/certificats:ro
      - caddy:/data
      - caddy_config:/config
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1/_sante']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [interne, acces]

networks:
  interne:
    internal: ${RESEAU_INTERNE:-false}
  acces:

volumes:
  documents:
  identifiants:
  donnees:
    name: ${VOLUME_POSTGRES:-${COMPOSE_PROJECT_NAME}_donnees}
  caddy:
  caddy_config:
