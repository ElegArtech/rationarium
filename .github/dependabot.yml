# Mises à jour de sécurité et de version, regroupées pour rester relisibles.
# Toute nouvelle dépendance reste soumise à un ADR (C1, ADR-0013) : Dependabot
# ne fait que monter des versions déjà admises.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
        update-types: [patch, minor]
      developpement:
        dependency-type: development
        update-types: [patch, minor]
  - package-ecosystem: docker
    directories: [/deploiement]
    schedule:
      interval: weekly
